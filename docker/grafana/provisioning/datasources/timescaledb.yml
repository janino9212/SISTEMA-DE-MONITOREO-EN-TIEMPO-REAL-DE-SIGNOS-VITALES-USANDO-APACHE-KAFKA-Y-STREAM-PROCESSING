apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: $TIMESCALE_USER
    isDefault: true
    jsonData:
      database: $TIMESCALE_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: $TIMESCALE_PASSWORD

spring:
  application:
    name: persistencia
  config:
    # Lee las credenciales del archivo .env de la raíz del proyecto (RNF-19: no van en el repositorio).
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${TIMESCALE_PORT:5433}/${TIMESCALE_DB}
    username: ${TIMESCALE_USER}
    password: ${TIMESCALE_PASSWORD}
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

spring:
  application:
    name: simulador
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: co.edu.uts.vitales.common.serde.GenericJsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5

simulador:
  pacientes: 10
  semilla: 42
  id-escenario: demo-001
  intervalo-ms: 1000
  crisis-demo-despues-de-segundos: 30   # -1 para desactivar
